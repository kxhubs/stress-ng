name: Sync with Upstream

on:
  schedule:
    - cron: '0 4 * * *'   # 每天 UTC 4点同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN || github.token }}
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          UPSTREAM_URL="https://github.com/ColinIanKing/stress-ng.git"
          TAG_PATTERN='^V[0-9]+(\.[0-9]+)+([.-][A-Za-z0-9]+)?$'

          git config user.name "kxhubs"
          git config user.email "20880604+kxhubs@users.noreply.github.com"

          git remote set-url upstream "${UPSTREAM_URL}" 2>/dev/null || git remote add upstream "${UPSTREAM_URL}"

          git fetch origin --tags --prune "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git tag -l 'V*' | { grep -E "${TAG_PATTERN}" || true; } | sort > origin-tags.txt

          git fetch upstream --tags --prune '+refs/heads/*:refs/remotes/upstream/*'

          UPSTREAM_BRANCH="master"
          if ! git rev-parse --verify --quiet "refs/remotes/upstream/${UPSTREAM_BRANCH}" >/dev/null; then
            UPSTREAM_BRANCH="main"
          fi

          git checkout -B "${DEFAULT_BRANCH}" "refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge --no-edit "refs/remotes/upstream/${UPSTREAM_BRANCH}"
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"

          git tag -l 'V*' | { grep -E "${TAG_PATTERN}" || true; } | sort > all-tags.txt
          comm -13 origin-tags.txt all-tags.txt > new-tags.txt

          if [ -s new-tags.txt ]; then
            while IFS= read -r tag; do
              git push origin "refs/tags/${tag}:refs/tags/${tag}"
            done < new-tags.txt
          fi

          if [ -s new-tags.txt ]; then
            echo "has_new_tags=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_new_tags=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run CI builds after sync
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow run ci-builds.yml \
            --repo "${TARGET_REPOSITORY}" \
            --ref "refs/heads/${DEFAULT_BRANCH}"

      - name: Build new upstream tags
        if: ${{ steps.sync.outputs.has_new_tags == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            gh workflow run build-arm64-release.yml \
              --repo "${TARGET_REPOSITORY}" \
              --ref "refs/heads/${DEFAULT_BRANCH}" \
              -f tag="${tag}"
          done < new-tags.txt
