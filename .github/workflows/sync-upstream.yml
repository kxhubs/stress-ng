name: Sync with Upstream

on:
  schedule:
    - cron: '0 4 * * *'   # 每天 UTC 4点同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          ref: master   # 或 main，根据你的默认分支

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/ColinIanKing/stress-ng.git || true
          git fetch upstream --tags --prune
          
          git checkout master || git checkout main
          git merge upstream/master --ff-only || git merge upstream/main --ff-only || true
          
          git push origin HEAD
          git push --tags
